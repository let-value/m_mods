name: Build and release Опа

on:
  push:
    branches:
      - ci/modpack-release
    tags:
      - "opa-1.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CurseForge: ${{ secrets.CURSEFORGE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8
      - name: Download mods
        run: dotnet run --project src/m_mods.csproj -- curseforge "packs/Опа-1.0.zip" out
      - name: Archive mods
        run: cd out && zip -9 -r ../mods.zip ./*
      - name: Validate release assets
        run: |
          test -s modpack.zip
          test -s mods.zip
          test -s out/README.md
          unzip -tq modpack.zip
          unzip -tq mods.zip
      - uses: actions/upload-artifact@v7
        with:
          name: opa-release-assets
          path: |
            modpack.zip
            mods.zip
            out/README.md
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    if: github.ref == 'refs/tags/opa-1.0'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: opa-release-assets
          path: dist
      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Опа 1.0
          artifacts: "dist/modpack.zip,dist/mods.zip"
          bodyFile: "dist/out/README.md"
